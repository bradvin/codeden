<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>CodeDen servers</title>
<style>
  :root { color-scheme: light dark; --bg:#fff; --fg:#14171a; --muted:#68717a; --line:#dfe3e7; --card:#f6f7f8; --accent:#2f6fed; --bad:#c0392b; --ok:#2e8b57; --warn:#b7791f; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0b0d10; --fg:#e6e8eb; --muted:#8b949e; --line:#262b31; --card:#14181c; --accent:#6c9bff; --bad:#ff7b6b; --ok:#5fcf8f; --warn:#e3b341; } }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px; font: 14px/1.45 system-ui, sans-serif; background: var(--bg); color: var(--fg); }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p.lead { margin: 0 0 20px; color: var(--muted); }
  .row { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); margin-bottom: 8px; }
  .row .main { flex: 1; min-width: 0; }
  .name { font-weight: 600; }
  .url { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .state { font-size: 12px; }
  .state.ok { color: var(--ok); } .state.signed-out, .state.connecting { color: var(--warn); } .state.unreachable { color: var(--bad); }
  button { font: inherit; padding: 5px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .55; cursor: default; }
  form { margin-top: 24px; padding: 14px; border: 1px solid var(--line); border-radius: 8px; }
  form h2 { font-size: 14px; margin: 0 0 10px; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 8px 0 3px; }
  input { width: 100%; font: inherit; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
  .msg { margin-top: 10px; font-size: 13px; min-height: 1.4em; }
  .msg.bad { color: var(--bad); } .msg.warn { color: var(--warn); } .msg.ok { color: var(--ok); }
  .actions { display: flex; gap: 6px; }
</style>
</head>
<body>
<h1>Servers</h1>
<p class="lead">This Mac is the CodeDen this app runs. Other servers open in their own window; their projects, sessions and agents stay on that machine.</p>
<div id="rows"></div>
<form id="add" autocomplete="off">
  <h2>Add a server</h2>
  <label for="name">Name</label>
  <input id="name" maxlength="60" placeholder="Omarchy" required>
  <label for="url">Address (https only)</label>
  <input id="url" placeholder="https://omaweb.your-tailnet.ts.net:8446" required spellcheck="false">
  <div class="msg" id="msg" role="status"></div>
  <button class="primary" id="submit" type="submit">Add server</button>
</form>
<script>
  const api = window.codedenServers;
  const rowsEl = document.getElementById("rows");
  const msg = document.getElementById("msg");
  const LABELS = { ok: "Connected", "signed-out": "Signed out", unreachable: "Unreachable", connecting: "Connecting..." };

  function say(text, kind) { msg.textContent = text || ""; msg.className = "msg " + (kind || ""); }

  function button(label, onClick) {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = label; b.addEventListener("click", onClick);
    return b;
  }

  function render(rows) {
    rowsEl.replaceChildren(...rows.map((r) => {
      const el = document.createElement("div"); el.className = "row";
      const main = document.createElement("div"); main.className = "main";
      const name = document.createElement("div"); name.className = "name"; name.textContent = r.name;
      main.append(name);
      if (r.url) { const u = document.createElement("div"); u.className = "url"; u.textContent = r.url; main.append(u); }
      el.append(main);
      if (r.state) { const s = document.createElement("span"); s.className = "state " + r.state; s.textContent = LABELS[r.state] || r.state; el.append(s); }
      const actions = document.createElement("div"); actions.className = "actions";
      actions.append(button("Open", () => api.open(r.id)));
      if (r.url) {
        actions.append(button("Rename", async () => {
          const next = prompt("New name", r.name);
          if (next === null) return;
          const res = await api.rename(r.id, next);
          if (!res.ok) say(res.problem || "Could not rename.", "bad");
        }));
        actions.append(button("Remove", async () => {
          if (!confirm("Remove " + r.name + "? This signs this device out of that server. The server itself is not touched.")) return;
          await api.remove(r.id);
        }));
      }
      el.append(actions);
      return el;
    }));
  }

  document.getElementById("add").addEventListener("submit", async (e) => {
    e.preventDefault();
    const submit = document.getElementById("submit");
    submit.disabled = true; say("Checking the server...");
    try {
      const res = await api.add(document.getElementById("name").value, document.getElementById("url").value);
      if (!res.ok) { say(res.problem, "bad"); return; }
      document.getElementById("name").value = ""; document.getElementById("url").value = "";
      say(res.warning || "Added. Opening it...", res.warning ? "warn" : "ok");
      api.open(res.server.id);
    } finally { submit.disabled = false; }
  });

  api.onChange(render);
  api.list().then(render);
</script>
</body>
</html>
